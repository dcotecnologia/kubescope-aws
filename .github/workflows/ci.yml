name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # while the extension API is unstable, the tests run the extension in the window
  # of the app, which is a development dependency (see pyproject.toml)
  APP_REF: dev/v2
  QT_QPA_PLATFORM: offscreen

defaults:
  run:
    working-directory: ext

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ext

      - uses: actions/checkout@v7
        with:
          repository: dcotecnologia/kubescope
          ref: ${{ env.APP_REF }}
          path: kubescope

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: ext/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('ext/.pre-commit-config.yaml') }}

      # ruff, ruff format, docformatter, pyright and the checks of the files
      - name: Pre-commit
        run: uv run --with pre-commit pre-commit run --all-files --show-diff-on-failure

      - name: Language files list the texts of the code
        run: |
          uv run python tools/i18n.py
          git diff --exit-code -- languages \
            || (echo "Run 'make i18n' and commit the language files" && exit 1)

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: ext

      - uses: actions/checkout@v7
        with:
          repository: dcotecnologia/kubescope
          ref: ${{ env.APP_REF }}
          path: kubescope

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: ext/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -q
